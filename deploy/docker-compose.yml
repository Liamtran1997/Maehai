# Production stack. Run from the repo root:
#   cp deploy/.env.example deploy/.env   (then fill it in)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: maehai

x-api: &api
  build: { context: .., dockerfile: deploy/Dockerfile.api }
  image: maehai-api
  restart: unless-stopped
  env_file: .env
  environment: &api-env
    DJANGO_DEBUG: "0"
    DATABASE_URL: postgres://${POSTGRES_USER:-maehai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-maehai}
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /data/media
    PRIVATE_MEDIA_ROOT: /data/private
    TRUSTED_PROXY_COUNT: "1"            # Caddy is the one proxy in front of the API
    ALLOWED_HOSTS: ${PUBLIC_HOST},api,localhost
    CORS_ORIGINS: ${PUBLIC_ORIGIN}
    PUBLIC_SHOP_URL: ${PUBLIC_ORIGIN}
    PUBLIC_MEDIA_ORIGIN: ${PUBLIC_ORIGIN}   # photos and campaign files are linked with this origin, not the API's internal host
    ADMIN_URL: ${PUBLIC_ORIGIN}/admin
  volumes: [media:/data/media, private:/data/private]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maehai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-maehai}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # rate-limit counters only; losing them on restart is fine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: maehai-api
    env_file: .env
    environment:
      <<: *api-env
    command: ["python", "manage.py", "migrate", "--noinput"]
    volumes: [media:/data/media, private:/data/private]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api
    expose: ["8000"]

  # Sends queued LINE messages. If this is not running, no customer or staff message ever leaves the shop.
  worker:
    <<: *api
    command: ["python", "manage.py", "send_notifications", "--loop", "--interval", "5"]
    healthcheck: { disable: true }      # no HTTP port; the image's API healthcheck does not apply
    depends_on:
      api: { condition: service_healthy }

  # Cancels orders left unpaid too long so their reserved stock goes back on sale.
  scheduler:
    <<: *api
    command: ["python", "manage.py", "run_scheduler"]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

  shop:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.shop
      args: { NEXT_PUBLIC_API_URL: "" }
    image: maehai-shop
    restart: unless-stopped
    environment:
      API_URL: http://api:8000          # server-side rendering talks to the API over the internal network
    expose: ["3000"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { VITE_API_URL: "" }
    image: maehai-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - media:/srv/media:ro            # product photos; the Caddyfile refuses everything else under /media
      - caddy_data:/data               # certificates
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      shop: { condition: service_healthy }

volumes:
  pgdata:
  media:
  private:      # payment slips: never mounted into the web container
  caddy_data:
  caddy_config:
