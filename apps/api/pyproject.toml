[project]
name = "maehai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<6",
  "django-ninja>=1.3",
  "django-cors-headers>=4.4",
  "dj-database-url>=2.2",
  "psycopg[binary]>=3.2",
  "pillow>=10.4",
  "celery[redis]>=5.4",
  "promptpay>=1.0",
  "gunicorn>=23",
  "whitenoise>=6.12.0",
  "django-storages[s3]>=1.14.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.7"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 100
